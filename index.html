<!DOCTYPE html>
<html>
<head>
  <base href="/">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="MyBusiness Management SAAS">

  <!-- iOS meta tags & icons -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="myBusiness">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no">
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>MyBusiness</title>
  <link rel="manifest" href="manifest.json">

  <!-- Pure CSS Centered Circular Loader -->
  <style>
    body {
      background-color: #f8f9fa;
      margin: 0;
      padding: 0;
      height: 100vh;
      width: 100vw;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    .circular-loader {
      width: 48px;
      height: 48px;
      border: 5px solid #e0e0e0;
      border-top: 5px solid #0066cc; /* Match your app's primary theme color */
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
  </style>
  <script src="https://checkout.razorpay.com/v1/checkout.js"></script>

  <script>
    window.openRazorpayCheckout = function (
      optionsJson,
      onSuccess,
      onFailure,
      onDismiss
    ) {
      try {
        const options = JSON.parse(optionsJson);
        let completed = false;

        options.handler = function (response) {
          completed = true;
          onSuccess(JSON.stringify(response));
        };

        options.modal = {
          ondismiss: function () {
            if (!completed) {
              onDismiss();
            }
          }
        };

        const razorpay = new Razorpay(options);

        razorpay.on('payment.failed', function (response) {
          completed = true;
          onFailure(JSON.stringify(response));
        });

        razorpay.open();

      } catch (error) {
        onFailure(JSON.stringify({
          message: error.message
        }));
      }
    };
  </script>
</head>
<body>
<!-- HTML Loader: Appears instantly before Flutter JavaScript initializes -->
<div id="loading-indicator" class="loading-container">
  <div class="circular-loader"></div>
</div>

<script src="flutter_bootstrap.js" async></script>
</body>
</html>
